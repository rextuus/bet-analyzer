; bet-analyzer – PHP-Einstellungen für app, worker, cron (Produktion)
expose_php = Off
; Die Buchmacher schicken die Tagesliste per POST (Bwin mehrere MB).
upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M
max_execution_time = 60
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
date.timezone = Europe/Berlin
