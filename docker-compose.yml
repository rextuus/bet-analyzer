# Lokale Entwicklung: nur die Datenbank (PHP läuft auf dem Host, siehe Makefile).
# Produktion: compose.prod.yaml (unabhängig davon).
services:
  database:
    # Dieselbe Version wie in Produktion, damit ein Dump von dort ohne Überraschungen passt.
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bet_analyzer
      MYSQL_USER: bet_analyzer
      MYSQL_PASSWORD: bet_analyzer
      TZ: Europe/Berlin
    command:
      - "--max-allowed-packet=256M"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - database:/var/lib/mysql:rw
    # 3306/3307 sind auf diesem Rechner von wedora/meridim belegt.
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"

volumes:
  # Eigener Name, damit er nie mit dem Produktions-Volume (bet-analyzer_database_data) verwechselt wird.
  database:
    name: bet-analyzer-dev_database
